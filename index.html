<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Service Request Dashboard</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="topbar">

        <div>
            <h1>Service Request Management System</h1>
            <p>Online Service Request Dashboard</p>
        </div>

        <button id="logoutBtn">Logout</button>

    </header>


    <main class="container">

        <!-- Dashboard -->
        <section class="dashboard">

            <div class="summary-card">
                <h3>Total</h3>
                <p id="totalCount">0</p>
            </div>

            <div class="summary-card">
                <h3>Pending</h3>
                <p id="pendingCount">0</p>
            </div>

            <div class="summary-card">
                <h3>In Progress</h3>
                <p id="progressCount">0</p>
            </div>

            <div class="summary-card">
                <h3>Completed</h3>
                <p id="completedCount">0</p>
            </div>

        </section>


        <!-- Add Request -->
        <section class="form-section">

            <h2 id="formTitle">Add Service Request</h2>

            <form id="requestForm">

                <input type="hidden" id="requestId">

                <div class="form-group">

                    <label for="requesterName">
                        Requester Name
                    </label>

                    <input
                        type="text"
                        id="requesterName"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="department">
                        Department
                    </label>

                    <input
                        type="text"
                        id="department"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="category">
                        Category
                    </label>

                    <select id="category" required>

                        <option value="">Select Category</option>
                        <option value="Hardware">Hardware</option>
                        <option value="Software">Software</option>
                        <option value="Network">Network</option>
                        <option value="Account">Account</option>
                        <option value="Other">Other</option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="description">
                        Description
                    </label>

                    <textarea
                        id="description"
                        rows="4"
                        required
                    ></textarea>

                </div>


                <div class="form-group">

                    <label for="priority">
                        Priority
                    </label>

                    <select id="priority" required>

                        <option value="">Select Priority</option>
                        <option value="Low">Low</option>
                        <option value="Medium">Medium</option>
                        <option value="High">High</option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="status">
                        Status
                    </label>

                    <select id="status">

                        <option value="Pending">Pending</option>
                        <option value="In Progress">
                            In Progress
                        </option>
                        <option value="Completed">
                            Completed
                        </option>

                    </select>

                </div>


                <button type="submit" id="saveBtn">
                    Add Request
                </button>

                <button
                    type="button"
                    id="cancelBtn"
                    class="secondary-btn hidden"
                >
                    Cancel
                </button>

            </form>

            <p id="formMessage"></p>

        </section>


        <!-- Search and Filter -->

        <section class="search-section">

            <h2>Search and Filter</h2>

            <div class="filters">

                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search requester or description..."
                >

                <select id="statusFilter" title="Filter by status">

                    <option value="">All Status</option>
                    <option value="Pending">Pending</option>
                    <option value="In Progress">In Progress</option>
                    <option value="Completed">Completed</option>

                </select>


                <select id="priorityFilter" title="Filter by priority">

                    <option value="">All Priority</option>
                    <option value="Low">Low</option>
                    <option value="Medium">Medium</option>
                    <option value="High">High</option>

                </select>

            </div>

        </section>


        <!-- Requests -->

        <section class="table-section">

            <h2>Service Requests</h2>

            <div class="table-wrapper">

                <table>

                    <thead>

                        <tr>
                            <th>ID</th>
                            <th>Requester</th>
                            <th>Department</th>
                            <th>Category</th>
                            <th>Description</th>
                            <th>Priority</th>
                            <th>Status</th>
                            <th>Created</th>
                            <th>Actions</th>
                        </tr>

                    </thead>

                    <tbody id="requestTableBody">

                    </tbody>

                </table>

            </div>

        </section>

    </main>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="js/supabase.js"></script>

    <script src="js/app.js"></script>

</body>

</html>
